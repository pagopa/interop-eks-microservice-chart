# Test case: partially customized Flyway image (repositoryName only).
# Verifies that when repositoryPrefix and tag are not set in
# flywayInitContainer.image, chart defaults are used.
# Expected resulting image:
#   docker.io/<flyway.repositoryName>:8.2.3
name: "flyway-custom-image-partial-service"
namespace: "test-namespace"
techStack: "nodejs"

serviceAccount:
  roleArn: "arn:aws:iam::000000000:role/flyway-custom-image-partial-service"

service:
  create: true
  containerPort: 8080
  portName: http

deployment:
  replicas: 1
  image:
    repositoryPrefix: "000000000000.dkr.ecr.eu-central-1.amazonaws.com"
    tag: "1.5.0"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  flywayInitContainer:
    create: true
    image:
      # repositoryPrefix not set -> uses values.yaml default (docker.io)
      repositoryName: "interop-flyway-migrations"
      # tag not set -> uses values.yaml default ("8.2.3")
    executeFlywayMigrate: true
    executeFlywayRepair: false
    migrationPaths: "/flyway_custom_image_partial/migrations/v1_migrations,/flyway_custom_image_partial/migrations/v2_migrations"
    env:
      FLYWAY_URL: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
      POSTGRES_HOST: "db-host.example.com"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "mydb"
    envFromSecrets:
      FLYWAY_USER: "postgres-secret.POSTGRES_USR"
      FLYWAY_PASSWORD: "postgres-secret.POSTGRES_PSW"
