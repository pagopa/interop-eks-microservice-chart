suite: flyway failures
templates:
  - templates/deployment.yaml

tests:
  - it: fails when both migrationDomain and migrationsConfigmap are configured
    values:
      - flyway_fail_migrationdomain_and_configmap.yaml
    asserts:
      - failedTemplate: {}

  - it: fails when both migrationsConfigmap and migrationPaths are configured
    values:
      - flyway_fail_migrationpaths_and_configmap.yaml
    asserts:
      - failedTemplate: {}
          #errorPattern: 'Invalid configuration - Both migrationsConfigmap and migrationPaths in flywayInitContainer cannot be defined at the same time\.'

  - it: fails when both flyway actions are disabled
    values:
      - flyway_fail_no_actions.yaml
    asserts:
      - failedTemplate: {}
          #errorPattern: 'Invalid configuration: Both executeFlywayMigrate and executeFlywayRepair in the flywayInitContainer are false\.'

  - it: fails when repositoryPrefix is empty and flyway init container is enabled
    values:
      - flyway_fail_missing_repository_prefix.yaml
    asserts:
      - failedTemplate: {}

  - it: fails when repositoryName is empty and flyway init container is enabled
    values:
      - flyway_fail_missing_repository_name.yaml
    asserts:
      - failedTemplate: {}

  - it: fails when both tag and digest are empty and flyway init container is enabled
    values:
      - flyway_fail_missing_tag_and_digest.yaml
    asserts:
      - failedTemplate: {}
