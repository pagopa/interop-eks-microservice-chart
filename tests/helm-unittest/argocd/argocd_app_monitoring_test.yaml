suite: argocd app monitoring job
templates:
  - templates/job.yaml
values:
  - ../common/base.yaml

tests:
  - it: does not render Job when app monitoring is disabled
    set:
      argocd.appMonitoring.enable: false
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when app monitoring is enabled and one of the required values (jobNamespace) is missing
    set:
      argocd.appMonitoring.enable: true
      argocd.appMonitoring.serviceAccountName: argocd-tf-apply-monitoring
      argocd.appMonitoring.projectRepositoryURL: https://github.com/pagopa/interop-core-deployment
      argocd.appMonitoring.tfEnv: dev
      argocd.appMonitoring.tfStateBucketKeyPrefix: dev-es1
    asserts:
      - failedTemplate: {}

  - it: renders Job when app monitoring is enabled
    set:
      argocd.appMonitoring.enable: true
      argocd.appMonitoring.jobNamespace: argocd-monitoring
      argocd.appMonitoring.serviceAccountName: argocd-tf-apply-monitoring
      argocd.appMonitoring.projectRepositoryURL: https://github.com/pagopa/interop-core-deployment
      argocd.appMonitoring.projectRepositoryRef: main
      argocd.appMonitoring.workloadKind: Deployment
      argocd.appMonitoring.tfEnv: dev
      argocd.appMonitoring.tfStateBucketKeyPrefix: dev-es1
      namespace: dev-argocd-deploy
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: test-svc-dev-argocd-deploy
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PostSync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
          value: BeforeHookCreation
      - equal:
          path: spec.template.spec.serviceAccountName
          value: argocd-tf-apply-monitoring
      - equal:
          path: metadata.namespace
          value: argocd-monitoring
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TF_VAR_argocd_workload_name
            value: test-svc
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TF_VAR_argocd_workload_kind
            value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROJECT_REPOSITORY_URL
            value: https://github.com/pagopa/interop-core-deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROJECT_REPOSITORY_REF
            value: main
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TF_ENV
            value: dev
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TF_STATE_BUCKET_KEY_PREFIX
            value: dev-es1
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?m)^\s*-backend-config="key=\$\{TF_STATE_BUCKET_KEY_PREFIX\}/\$\{REPO_NAME\}/argocd-applications/monitoring/\$\{TF_VAR_K8S_NAMESPACE\}/\$\{TF_VAR_argocd_workload_name\}\.tfstate"$'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?m)^\s*terraform apply -var-file="\./env/\$\{TF_ENV\}/terraform\.tfvars" -auto-approve$'
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'terraform plan\b'

  - it: truncates a workload name longer than 48 characters in the Job name
    set:
      name: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvw
      namespace: prod-analytics
      argocd.appMonitoring.enable: true
      argocd.appMonitoring.jobNamespace: argocd-monitoring
      argocd.appMonitoring.serviceAccountName: argocd-tf-apply-monitoring
      argocd.appMonitoring.projectRepositoryURL: https://github.com/pagopa/interop-core-deployment
      argocd.appMonitoring.tfEnv: prod
      argocd.appMonitoring.tfStateBucketKeyPrefix: prod-es1
    asserts:
      - equal:
          path: metadata.name
          value: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuv-prod-analytics
      - matchRegex:
          path: metadata.name
          pattern: '^.{63}$'

  - it: renders terraform plan without apply when tfPlanOnly is true
    set:
      argocd.appMonitoring.enable: true
      argocd.appMonitoring.jobNamespace: argocd-monitoring
      argocd.appMonitoring.serviceAccountName: argocd-tf-apply-monitoring
      argocd.appMonitoring.projectRepositoryURL: https://github.com/pagopa/interop-core-deployment
      argocd.appMonitoring.tfEnv: dev
      argocd.appMonitoring.tfStateBucketKeyPrefix: dev-es1
      argocd.appMonitoring.tfPlanOnly: true
      namespace: dev-argocd-deploy
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?m)^\s*terraform plan -var-file="\./env/\$\{TF_ENV\}/terraform\.tfvars"$'
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'terraform apply\b'

  - it: renders terraform apply without plan when tfPlanOnly is false
    set:
      argocd.appMonitoring.enable: true
      argocd.appMonitoring.jobNamespace: argocd-monitoring
      argocd.appMonitoring.serviceAccountName: argocd-tf-apply-monitoring
      argocd.appMonitoring.projectRepositoryURL: https://github.com/pagopa/interop-core-deployment
      argocd.appMonitoring.tfEnv: dev
      argocd.appMonitoring.tfStateBucketKeyPrefix: dev-es1
      argocd.appMonitoring.tfPlanOnly: false
      namespace: dev-argocd-deploy
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '(?m)^\s*terraform apply -var-file="\./env/\$\{TF_ENV\}/terraform\.tfvars" -auto-approve$'
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'terraform plan\b'

  - it: renders a templated k8sNamespace independently of the Job namespace
    set:
      argocd.appMonitoring.enable: true
      argocd.appMonitoring.jobNamespace: argocd-monitoring
      argocd.appMonitoring.serviceAccountName: argocd-tf-apply-monitoring
      argocd.appMonitoring.projectRepositoryURL: https://github.com/pagopa/interop-core-deployment
      argocd.appMonitoring.tfEnv: dev
      argocd.appMonitoring.tfStateBucketKeyPrefix: dev-es1
      namespace: dev-argocd-deploy
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TF_VAR_K8S_NAMESPACE
            value: dev-argocd-deploy
      - equal:
          path: metadata.namespace
          value: argocd-monitoring
