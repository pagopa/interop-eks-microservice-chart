suite: argocd app monitoring job
templates:
  - templates/job.yaml
values:
  - ../common/base.yaml

tests:
  - it: does not render Job when app monitoring is disabled
    set:
      argocd.appMonitoring.enable: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders Job when app monitoring is enabled
    set:
      argocd.appMonitoring.enable: true
      argocd.appMonitoring.serviceAccountName: argocd-tf-apply-monitoring
      argocd.appMonitoring.projectRepositoryURL: git::https://github.com/pagopa/interop-core-deployment
      argocd.appMonitoring.projectRepositoryRef: main
      argocd.appMonitoring.workloadKind: Deployment
      argocd.appMonitoring.tfEnv: dev
      argocd.appMonitoring.tfStateBucketKeyPrefix: dev-es1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PostSync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
          value: HookSucceeded
      - equal:
          path: spec.template.spec.serviceAccountName
          value: argocd-tf-apply-monitoring
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TF_VAR_argocd_workload_name
            value: test-svc
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TF_VAR_argocd_workload_kind
            value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROJECT_REPOSITORY_URL
            value: git::https://github.com/pagopa/interop-core-deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROJECT_REPOSITORY_REF
            value: main
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TF_ENV
            value: dev
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TF_STATE_BUCKET_KEY_PREFIX
            value: dev-es1

  - it: derives repository name from PROJECT_REPOSITORY_URL in terraform backend key
    set:
      argocd.appMonitoring.enable: true
      argocd.appMonitoring.serviceAccountName: argocd-tf-apply-monitoring
      argocd.appMonitoring.projectRepositoryURL: git::https://github.com/pagopa/interop-core-deployment
      argocd.appMonitoring.tfEnv: dev
      argocd.appMonitoring.tfStateBucketKeyPrefix: dev-es1
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'REPO_NAME="\$\(basename "\$\{PROJECT_REPOSITORY_URL%.git\}"\)"'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '-backend-config="key=\$\{TF_STATE_BUCKET_KEY_PREFIX\}/\$\{REPO_NAME\}/argocd-applications/monitoring/\$\{TF_VAR_argocd_workload_name\}\.tfstate"'
