suite: external secret refresh policy
templates:
  - templates/externalSecret.yaml
  - templates/externalSecret.flyway.yaml
values:
  - ../common/base.yaml

tests:
  - it: defaults app refreshPolicy to OnChange
    template: templates/externalSecret.yaml
    values:
      - external-secret.yaml
    asserts:
      - equal:
          path: spec.refreshPolicy
          value: OnChange
      - equal:
          path: spec.refreshInterval
          value: "0"

  - it: renders app refreshPolicy Periodic with refreshInterval
    template: templates/externalSecret.yaml
    values:
      - external-secret.yaml
    set:
      externalSecrets.app.refreshPolicy: Periodic
      externalSecrets.app.refreshInterval: 1h
    asserts:
      - equal:
          path: spec.refreshPolicy
          value: Periodic
      - equal:
          path: spec.refreshInterval
          value: 1h

  - it: renders app refreshPolicy CreatedOnce
    template: templates/externalSecret.yaml
    values:
      - external-secret.yaml
    set:
      externalSecrets.app.refreshPolicy: CreatedOnce
    asserts:
      - equal:
          path: spec.refreshPolicy
          value: CreatedOnce

  - it: renders Flyway refreshPolicy Periodic with refreshInterval
    template: templates/externalSecret.flyway.yaml
    set:
      externalSecrets.flywayInitContainer.create: true
      externalSecrets.flywayInitContainer.secretStoreRef.name: cluster-secret-store
      externalSecrets.flywayInitContainer.refreshPolicy: Periodic
      externalSecrets.flywayInitContainer.refreshInterval: 30m
    asserts:
      - equal:
          path: spec.refreshPolicy
          value: Periodic
      - equal:
          path: spec.refreshInterval
          value: 30m

  - it: rejects app refreshPolicy Interval, which is not a valid ESO value
    values:
      - external-secret.yaml
    set:
      externalSecrets.app.refreshPolicy: Interval
    asserts:
      - failedTemplate: {}

  - it: rejects Flyway refreshPolicy Interval, which is not a valid ESO value
    set:
      externalSecrets.flywayInitContainer.create: true
      externalSecrets.flywayInitContainer.secretStoreRef.name: cluster-secret-store
      externalSecrets.flywayInitContainer.refreshPolicy: Interval
    asserts:
      - failedTemplate: {}
