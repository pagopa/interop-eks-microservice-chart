externalSecrets:
  flywayInitContainer:
    create: true
    targetSecret:
      name: fallback-flyway-secret
    data:
      - secretKey: flyway-password
        remoteRef:
          key: "/apps/{{ .Values.name }}/flyway"
          property: password
deployment:
  flywayInitContainer:
    create: true
    executeFlywayMigrate: true
    executeFlywayRepair: false
    image:
      repositoryPrefix: docker.io
      repositoryName: flyway/flyway
      tag: "10.0.0"
