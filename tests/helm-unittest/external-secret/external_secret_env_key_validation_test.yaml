suite: external secret env key validation
templates:
  - templates/deployment.yaml
values:
  - ../common/base.yaml

tests:
  - it: fails when app external secret key is not a valid env var name
    values:
      - external-secret-invalid-app-key.yaml
    asserts:
      - failedTemplate: {}

  - it: fails when flyway external secret key is not a valid env var name
    values:
      - external-secret-invalid-flyway-key.yaml
    asserts:
      - failedTemplate: {}
