suite: external secret env key validation
templates:
  - templates/deployment.yaml
values:
  - ../common/base.yaml

tests:
  - it: passes when secretKey is valid and remoteRef values contain hyphen
    values:
      - external-secret-valid-key-hyphen-value.yaml
    asserts:
      - hasDocuments:
          count: 1
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: fallback-app-secret

  - it: fails when app external secret key is not a valid env var name
    values:
      - external-secret-invalid-app-key.yaml
    asserts:
      - failedTemplate: {}

  - it: fails when flyway external secret key is not a valid env var name
    values:
      - external-secret-invalid-flyway-key.yaml
    asserts:
      - failedTemplate: {}
