# 2 rules with 64 matches each, plus a rule without matches, which gets one default match: 129
gateway:
  httpRoute:
    create: true
    parentRefs:
      - name: external
    hostnames:
      - test.example.internal
    # The same match repeated through a YAML alias: only the counts matter
    rules:
      - matches: [&m {path: {type: PathPrefix, value: /}}, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m]
      - matches: [*m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m, *m]
      - filters:
          - type: RequestHeaderModifier
            requestHeaderModifier:
              set:
                - name: X-Test
                  value: "true"
