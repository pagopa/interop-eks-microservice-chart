gateway:
  httpRoute:
    parentRefs:
      - name: "gateway-{{ .Values.namespace }}"
        namespace: "{{ .Values.namespace }}"
        sectionName: "{{ .Values.name }}-http"
    hostnames:
      - "{{ .Values.name }}.example.internal"
      - static.example.internal
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /old
        filters:
          - type: RequestRedirect
            requestRedirect:
              hostname: "{{ .Values.name }}.example.internal"
              statusCode: 301
