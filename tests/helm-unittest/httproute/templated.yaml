locals:
  appHostname: app.example.internal
  gatewayName: internal
  gatewayNamespace: gateways

gateway:
  httpRoute:
    parentRefs:
      - name: "{{.Values.locals.gatewayName}}"
        namespace: "{{.Values.locals.gatewayNamespace}}"
        sectionName: http
    hostnames:
      - "{{.Values.locals.appHostname}}"
      - static.example.internal
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /old
        filters:
          - type: RequestRedirect
            requestRedirect:
              hostname: "{{.Values.locals.appHostname}}"
              statusCode: 301
