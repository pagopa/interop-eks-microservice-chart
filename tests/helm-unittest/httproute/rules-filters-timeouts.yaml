gateway:
  httpRoute:
    timeouts:
      request: 30s
      backendRequest: 10s
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /api
        filters:
          - type: URLRewrite
            urlRewrite:
              path:
                type: ReplacePrefixMatch
                replacePrefixMatch: /
          - type: RequestHeaderModifier
            requestHeaderModifier:
              set:
                - name: X-Forwarded-Prefix
                  value: /api
        timeouts:
          request: 2m
      - matches:
          - path:
              type: Exact
              value: /status
          - headers:
              - name: X-Probe
                value: "true"
