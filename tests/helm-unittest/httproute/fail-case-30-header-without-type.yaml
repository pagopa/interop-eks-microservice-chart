# Without type the API server adds a default one, which ArgoCD sees as drift
gateway:
  httpRoute:
    create: true
    parentRefs:
      - name: external
    hostnames:
      - test.example.internal
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
            headers:
              - name: x-test
                value: "true"
