{{- $httpRoute := (.Values.gateway | default dict).httpRoute | default dict }}
{{- if $httpRoute.create }}
{{- if not (and .Values.service.create .Values.service.containerPort) }}
  {{ fail "gateway.httpRoute.create requires service.create and service.containerPort: the route sends traffic to the microservice Service." }}
{{- end }}

{{- $annotations := $httpRoute.annotations | default dict }}
{{- $rules := $httpRoute.rules | default (list (dict "matches" (list (dict "path" (dict "type" "PathPrefix" "value" "/"))))) }}

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "interop-eks-microservice-chart.labels" . | nindent 4 }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range $httpRoute.parentRefs }}
    {{- /* Optional fields are rendered first, so a template rendering empty leaves the field out */}}
    {{- $namespace := include "interop-eks-microservice-chart.render-template" (dict "value" (.namespace | default "") "context" $) }}
    {{- $sectionName := include "interop-eks-microservice-chart.render-template" (dict "value" (.sectionName | default "") "context" $) }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "interop-eks-microservice-chart.render-template" (dict "value" .name "context" $) | quote }}
      {{- if $namespace }}
      namespace: {{ $namespace | quote }}
      {{- end }}
      {{- if $sectionName }}
      sectionName: {{ $sectionName | quote }}
      {{- end }}
    {{- end }}
  hostnames:
    {{- range $httpRoute.hostnames }}
    - {{ include "interop-eks-microservice-chart.render-template" (dict "value" . "context" $) | quote }}
    {{- end }}
  rules:
    {{- range $rules }}
    {{- /* Matches and filters are Gateway API objects, rendered as-is; the backend is always the microservice Service */}}
    {{- $rule := . }}
    {{- /* Each timeout set on the rule overrides the route default for that field only; deepCopy keeps merge from changing .Values */}}
    {{- $timeouts := merge (deepCopy ($rule.timeouts | default dict)) ($httpRoute.timeouts | default dict) }}
    - backendRefs:
        - name: {{ $.Values.name }}
          port: {{ $.Values.service.servicePort | default $.Values.service.containerPort }}
      {{- with $rule.matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $rule.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
