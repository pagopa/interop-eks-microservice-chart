{{- $httpRoute := (.Values.gateway | default dict).httpRoute | default dict }}
{{- if $httpRoute.create }}
{{- if not (and .Values.service.create .Values.service.containerPort) }}
  {{ fail "gateway.httpRoute.create requires service.create and service.containerPort: the route sends traffic to the microservice Service." }}
{{- end }}
{{- /* Also checked by the schema; without hostnames the route would match every host of the Gateway listener */}}
{{- if or (empty $httpRoute.parentRefs) (empty $httpRoute.hostnames) }}
  {{ fail "gateway.httpRoute.create requires at least one parentRefs and one hostnames entry." }}
{{- end }}

{{- $annotations := $httpRoute.annotations | default dict }}
{{- $rules := $httpRoute.rules | default (list (dict "matches" (list (dict "path" (dict "type" "PathPrefix" "value" "/"))))) }}

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "interop-eks-microservice-chart.labels" . | nindent 4 }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range $index, $parentRef := $httpRoute.parentRefs }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      {{- /* Templated fields must not render empty: to leave an optional field out, omit it */}}
      {{- range $field := list "name" "namespace" "sectionName" }}
      {{- if hasKey $parentRef $field }}
      {{- $rendered := include "interop-eks-microservice-chart.render-template" (dict "value" (get $parentRef $field) "context" $) }}
      {{- if not $rendered }}
        {{ fail (printf "gateway.httpRoute.parentRefs[%d].%s renders empty." $index $field) }}
      {{- end }}
      {{ $field }}: {{ $rendered | quote }}
      {{- end }}
      {{- end }}
    {{- end }}
  hostnames:
    {{- range $index, $hostname := $httpRoute.hostnames }}
    {{- $rendered := include "interop-eks-microservice-chart.render-template" (dict "value" $hostname "context" $) }}
    {{- if not $rendered }}
      {{ fail (printf "gateway.httpRoute.hostnames[%d] renders empty." $index) }}
    {{- end }}
    - {{ $rendered | quote }}
    {{- end }}
  rules:
    {{- range $rules }}
    {{- /* Matches and filters are Gateway API objects, rendered as-is; the backend is always the microservice Service */}}
    {{- /* A rule's timeouts replace the route default as a whole */}}
    {{- $timeouts := .timeouts | default $httpRoute.timeouts }}
    - backendRefs:
        - name: {{ $.Values.name }}
          port: {{ $.Values.service.servicePort | default $.Values.service.containerPort }}
      {{- with .matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
