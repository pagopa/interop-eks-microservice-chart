{{- $flywayEnabled := and .Values.deployment .Values.deployment.flywayInitContainer .Values.deployment.flywayInitContainer.create -}}
{{- $migrationDomain := "" -}}
{{- if and $flywayEnabled .Values.deployment.flywayInitContainer.migrationDomain -}}
{{- $migrationDomain = .Values.deployment.flywayInitContainer.migrationDomain -}}
{{- end -}}
{{- $migrationsRoot := .Values.migrations | default dict -}}
{{- $selectedMigrations := dict -}}
{{- if and $migrationDomain (not (hasKey $migrationsRoot $migrationDomain)) -}}
{{ fail (printf "Invalid configuration: deployment.flywayInitContainer.migrationDomain '%s' not found in root migrations map." $migrationDomain) }}
{{- end -}}
{{- if and $flywayEnabled $migrationDomain -}}
{{- $selectedMigrations = index $migrationsRoot $migrationDomain -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $migrationDomain }}
  namespace: {{ .Values.namespace }}
data:
  {{- range $key, $val := $selectedMigrations }}
  {{ $key }}: |-
{{ $val | nindent 4 }}
  {{- end }}
{{- end }}
